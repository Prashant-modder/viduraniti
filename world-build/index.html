<!doctype html>
<meta charset="utf-8">
<title>World map</title>
<style>
  html,body{margin:0;height:100%;background:#eef1f5;font:13px system-ui}
  svg{width:100%;height:100%;display:block;cursor:grab}
  svg.drag{cursor:grabbing}
  path.country{fill:#cfd8dc;stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke}
  path.country:hover{fill:#ffb74d}
  path.state{fill:#ff9800;stroke:#7a4a00;stroke-width:.8;vector-effect:non-scaling-stroke}
  path.state:hover{fill:#ffc107}
  #tip{position:fixed;padding:4px 8px;background:#000c;color:#fff;border-radius:4px;
       pointer-events:none;display:none;white-space:nowrap}
</style>
<svg id="map" viewBox="0 0 3600 1800"></svg>
<div id="tip"></div>
<script>
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('map'),tip=document.getElementById('tip');
const g=document.createElementNS(NS,'g');svg.appendChild(g);
const showTip=(e,t)=>{tip.textContent=t;tip.style.display='block';
  tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px';};
const hideTip=()=>tip.style.display='none';
fetch('world.json').then(r=>r.json()).then(draw).catch(err=>{
  document.body.insertAdjacentHTML('beforeend',
    '<pre style="color:#b00020;padding:1em">'+err+
    '\n\nServe over HTTP — see 5c.</pre>');});
function draw(data){
  for(const c of data.countries){
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',c.d);p.setAttribute('class','country');
    p.addEventListener('mousemove',e=>showTip(e,c.n+' · '+((c.pop||0).toLocaleString())+' people'));
    p.addEventListener('mouseleave',hideTip);g.appendChild(p);
  }
  for(const s of data.india){
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',s.d);p.setAttribute('class','state');
    p.addEventListener('mousemove',e=>showTip(e,'India · '+s.n));
    p.addEventListener('mouseleave',hideTip);g.appendChild(p);
  }
  let k=1,tx=0,ty=0,drag=false,last=null;
  const apply=()=>g.setAttribute('transform','translate('+tx+' '+ty+') scale('+k+')');
  svg.addEventListener('wheel',e=>{e.preventDefault();
    const r=svg.getBoundingClientRect();
    const mx=(e.clientX-r.left)/r.width*3600,my=(e.clientY-r.top)/r.height*1800;
    const nk=Math.min(40,Math.max(0.5,k*Math.exp(-e.deltaY*0.0015)));
    tx=mx-(mx-tx)*(nk/k);ty=my-(my-ty)*(nk/k);k=nk;apply();},{passive:false});
  svg.addEventListener('pointerdown',e=>{drag=true;last=[e.clientX,e.clientY];
    svg.classList.add('drag');svg.setPointerCapture(e.pointerId);});
  svg.addEventListener('pointermove',e=>{if(!drag)return;
    const r=svg.getBoundingClientRect();
    tx+=(e.clientX-last[0])*3600/r.width;ty+=(e.clientY-last[1])*1800/r.height;
    last=[e.clientX,e.clientY];apply();});
  svg.addEventListener('pointerup',()=>{drag=false;svg.classList.remove('drag');});
}
</script>
